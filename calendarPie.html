  <body class="calendarPie">

        <!-- Center hole -->

          class="marker"
          d="M 200 47 L 192 35 L 208 35 Z"
          aria-hidden="true"
        />
      </svg>

      <div id="info" aria-live="polite"></div>
    </div>
