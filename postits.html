<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4eee3" />
    <title>Blob of attention</title>

    <link rel="stylesheet" href="postitStyle.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat">
      <p>help me clean my head and I’ll tell you what is this all about</p>
      <p>just catch all these notes to throw them away</p>
    </div>
    <main class="app-shell">
      <section class="board" aria-labelledby="board-title">
        <div class="board-intro-count">
          <!-- <div class="board-heading">
            <h2 id="board-title">Help me clear my head</h2>
            <span class="board-hint">One at a time</span>
          </div> -->
          <h2 id="done-title">Done <span id="done-count">0</span></h2>
        </div>
        <div id="notes" class="notes" aria-label="Open tasks"></div>
        <div class="msg">
          <div class="hidden-board-msg">
            I am an artist & tech worker, I have very few free time tokens to
            spend on my will each day.
          </div>
        </div>
        <!-- <aside class="done-area" aria-labelledby="done-title"> -->

        <div id="done-notes" class="done-notes"></div>
        <!-- </aside> -->
      </section>

      <!-- <section id="completion" class="completion" hidden aria-live="polite">
      <span class="completion-mark" aria-hidden="true">✓</span>
      <div><p class="eyebrow">A lovely little finish</p><h2>Everything is cleared.</h2></div> -->
      <!-- <button id="reset-tasks" type="button">
        Reset tasks <span aria-hidden="true">↺</span>
      </button> -->
      <!-- </section> -->
      <header class="app-header">
        <div class="progress-panel" aria-label="Task progress">
          <span class="progress-label">Cleared</span>
          <strong id="progress-text">0 of 10</strong>
          <div class="progress-track" aria-hidden="true">
            <span id="progress-bar"></span>
          </div>
        </div>
        <button id="reset-tasks" type="button">
          Reset tasks <span aria-hidden="true">↺</span>
        </button>
      </header>
      <p
        id="live-region"
        class="sr-only"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </main>
    <footer>
      <a href="index.html" class="button">back</a>
      <a href="postits.html" class="button">what you will?</a>
    </footer>
    <script src="script.js"></script>
    <script src="typewritter.js"></script>
  </body>
</html>
